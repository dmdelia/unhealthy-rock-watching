<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ASTREA Stream Audio - Deep Space</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
    audio{display:none}
  </style>
</head>
<body>
  <audio id="player" preload="auto"></audio>
  <script>
    (() => {
      const tracks = [
        '/streamaudiotracks/deepspace-01.mp3',
        '/streamaudiotracks/deepspace-02.mp3',
        '/streamaudiotracks/deepspace-03.mp3'
      ];

      const player = document.getElementById('player');
      const params = new URLSearchParams(location.search);
      const requestedVolume = Number(params.get('volume'));
      player.volume = Number.isFinite(requestedVolume)
        ? Math.min(1, Math.max(0, requestedVolume))
        : 1;

      let queue = [];
      let queueIndex = 0;
      let previousTrack = null;
      let retryTimer = null;

      function shuffle(items) {
        const result = [...items];
        for (let i = result.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [result[i], result[j]] = [result[j], result[i]];
        }
        return result;
      }

      function buildQueue() {
        queue = shuffle(tracks);

        if (previousTrack && queue.length > 1 && queue[0] === previousTrack) {
          [queue[0], queue[1]] = [queue[1], queue[0]];
        }

        queueIndex = 0;
      }

      async function playCurrent() {
        clearTimeout(retryTimer);

        if (!queue.length || queueIndex >= queue.length) {
          buildQueue();
        }

        const track = queue[queueIndex];
        player.src = track;
        player.load();

        try {
          await player.play();
        } catch (error) {
          retryTimer = setTimeout(playCurrent, 1000);
        }
      }

      function advance() {
        previousTrack = queue[queueIndex];
        queueIndex += 1;

        if (queueIndex >= queue.length) {
          buildQueue();
        }

        playCurrent();
      }

      player.addEventListener('ended', advance);
      player.addEventListener('error', () => {
        retryTimer = setTimeout(advance, 1000);
      });

      buildQueue();
      playCurrent();
    })();
  </script>
</body>
</html>
